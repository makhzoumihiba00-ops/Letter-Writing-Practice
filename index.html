<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letter Writing Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/letter-writing.css" />
</head>
<body class="home-page">
  <div class="floating-shapes" aria-hidden="true">
    <span class="shape shape-a">A</span>
    <span class="shape shape-b">B</span>
    <span class="shape shape-c">C</span>
    <span class="shape shape-star">★</span>

  <main class="home-container">
    <section class="welcome-card">
      <div class="mascot-badge" aria-hidden="true">
        <span class="mascot-pencil">✏️</span>
      </div>

      <span class="pill-tag">ABC Kids Studio</span>
      <h1 class="home-title">Letter Writing Practice</h1>
      <p class="home-subtitle">Learn to write English letters step by step!</p>

      <div class="preview-tiles" aria-hidden="true">
        <span class="tile tile-green">A</span>
        <span class="tile tile-blue">B</span>
        <span class="tile tile-orange">C</span>
        <span class="tile tile-purple">D</span>
      </div>

      <a href="pages/letter-writing.html" class="btn btn-primary btn-lg">
        <span>Start Learning</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M5 12H19M19 12L13 6M19 12L13 18"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
